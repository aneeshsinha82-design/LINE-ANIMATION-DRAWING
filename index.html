<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line Animation Drawing</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0f; color: #f5f5f5; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(92vw, 760px); text-align: center; padding: 3rem 1.5rem; }
    h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 0 0 1rem; letter-spacing: -.04em; }
    p { color: #b8b8c4; margin: 0 auto; max-width: 38rem; }
    .line { width: min(360px, 75vw); height: 3px; background: linear-gradient(90deg, transparent, #f5f5f5, transparent); margin: 2rem auto; animation: draw 2.5s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes draw { from { transform: scaleX(.08); opacity: .45; } to { transform: scaleX(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Line Animation Drawing</h1>
    <div class="line" aria-hidden="true"></div>
    <p>A minimal home page for the LINE-ANIMATION-DRAWING project.</p>
  </main>
</body>
</html>
